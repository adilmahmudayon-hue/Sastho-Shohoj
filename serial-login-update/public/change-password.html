<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Serial – Change password</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🩺 Serial</h1>
    <p>Choose your own password</p>
  </header>
  <main class="narrow">
    <div id="message" class="message" hidden></div>
    <form id="pwForm" class="card" novalidate>
      <h2>Change password</h2>
      <p class="hint">Your temporary password was generated for you. Please replace it now. Use at least 8 characters with a letter and a number.</p>
      <div class="grid one">
        <label>Current (temporary) password<input name="currentPassword" type="password" autocomplete="current-password" required /></label>
        <label>New password<input name="newPassword" type="password" autocomplete="new-password" required /></label>
        <label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" required /></label>
      </div>
      <button type="submit" class="primary">Save new password</button>
      <p class="links"><a href="#" id="logout">Log out</a></p>
    </form>
  </main>
  <script>
    const msg = document.getElementById('message');
    const form = document.getElementById('pwForm');
    const show = (t, type = 'error') => { msg.hidden = !t; msg.textContent = t; msg.className = 'message ' + type; };

    fetch('/api/auth/me').then((r) => { if (!r.ok) location.href = '/'; });

    document.getElementById('logout').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', { method: 'POST' });
      location.href = '/';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      show('');
      if (form.newPassword.value !== form.confirm.value) return show('New passwords do not match.');
      const btn = form.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword: form.currentPassword.value, newPassword: form.newPassword.value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not change password');
        show('Password changed. Redirecting…', 'ok');
        setTimeout(() => (location.href = '/dashboard.html'), 800);
      } catch (err) { show(err.message); }
      finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
