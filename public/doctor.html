<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Serial – Doctor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">🩺 Serial <small class="hint">Doctor</small></div>
      <nav id="nav">
        <a href="#dashboard" data-view="dashboard">🏠 Dashboard</a>
        <a href="#schedule" data-view="schedule">📅 My Schedule</a>
        <a href="#history" data-view="history">📋 Visit History</a>
        <a href="#workplaces" data-view="workplaces">🏥 My Workplaces</a>
        <a href="#notifications" data-view="notifications">🔔 Notifications <span id="badge" class="badge" hidden></span></a>
        <a href="#profile" data-view="profile">👤 My Profile</a>
      </nav>
      <button id="logout" class="secondary">Log out</button>
    </aside>

    <section class="content">
      <div class="mobilebar"><button id="menuBtn" class="secondary">☰</button><strong>Serial Doctor</strong></div>
      <div id="msg" class="message" hidden></div>
      <div id="view"></div>
    </section>
  </div>

  <div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
  <script src="common.js"></script>
  <script src="doctor.js"></script>
</body>
</html>
