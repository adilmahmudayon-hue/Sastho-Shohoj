<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Serial – Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="home"><div class="card home-card"><div class="logo">🩺</div><p class="hint">Opening your dashboard…</p></div></main>
  <script>
    // Sends every role to its own portal
    const PORTALS = { patient: '/patient.html', doctor: '/doctor.html', admin: '/admin.html' };
    (async () => {
      const r = await fetch('/api/auth/me');
      if (!r.ok) { location.href = '/'; return; }
      const me = await r.json();
      if (me.mustChangePassword) { location.href = '/change-password.html'; return; }
      location.href = PORTALS[me.role] || '/';
    })();
  </script>
</body>
</html>
