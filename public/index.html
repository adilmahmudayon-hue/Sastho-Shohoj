<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Serial – Doctor Appointments</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="home">
    <div id="home" class="card home-card">
      <div class="logo">🩺</div>
      <h1>Serial</h1>
      <p class="hint">Book doctor appointments without the waiting line.</p>

      <div id="loggedIn" class="message ok" hidden>
        You are logged in as <strong id="meName"></strong>.
        <a href="dashboard.html">Go to my dashboard →</a>
      </div>

      <a class="btn solid" href="login.html">Login</a>
      <a class="btn outline" href="register.html">Register</a>
      <button class="btn danger" id="exitBtn" type="button">Exit</button>
    </div>

    <div id="goodbye" class="card home-card" hidden>
      <div class="logo">👋</div>
      <h2>Thank you for visiting Serial</h2>
      <p class="hint">You have been logged out. You can now close this tab.</p>
      <a class="btn outline" href="/">Back to home</a>
    </div>
  </main>

  <script>
    fetch('/api/auth/me').then((r) => (r.ok ? r.json() : null)).then((me) => {
      if (!me) return;
      document.getElementById('meName').textContent = me.name || me.email;
      document.getElementById('loggedIn').hidden = false;
    });

    document.getElementById('exitBtn').addEventListener('click', async () => {
      try { await fetch('/api/auth/logout', { method: 'POST' }); } catch {}
      document.getElementById('home').hidden = true;
      document.getElementById('goodbye').hidden = false;
      window.close(); // browsers ignore this unless the tab was opened by a script
    });
  </script>
</body>
</html>
